# =============================================================================
# NelloreRuchullu Docker Compose - Development
# =============================================================================
# Usage: docker-compose -f docker-compose.dev.yml up

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: nellore_postgres_dev
    environment:
      POSTGRES_USER: nelloreruchullu
      POSTGRES_PASSWORD: nelloreruchullu_secret_2024
      POSTGRES_DB: nelloreruchullu
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nelloreruchullu -d nelloreruchullu"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nellore_dev_network
    restart: unless-stopped

  # ===========================================================================
  # Redis Cache
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: nellore_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nellore_dev_network
    restart: unless-stopped

  # ===========================================================================
  # Backend API (FastAPI) - Development with hot reload
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: nellore_backend_dev
    environment:
      DATABASE_URL: postgresql+asyncpg://nelloreruchullu:nelloreruchullu_secret_2024@postgres:5432/nelloreruchullu
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production
      ENVIRONMENT: development
      API_PREFIX: /api/v1
      RAZORPAY_KEY_ID: rzp_test_1234567890
      RAZORPAY_KEY_SECRET: test_secret_1234567890
      RAZORPAY_WEBHOOK_SECRET: webhook_secret_123
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: noreply@nellore-ruchullu.com
      SMTP_PASSWORD: placeholder
      TWILIO_ACCOUNT_SID: placeholder
      TWILIO_AUTH_TOKEN: placeholder
      TWILIO_FROM_NUMBER: "+919999999999"
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/__pycache__
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --workers 1"
    networks:
      - nellore_dev_network
    restart: unless-stopped

  # ===========================================================================
  # Frontend (Next.js) - Development with hot reload
  # ===========================================================================
  web:
    image: node:22-alpine
    container_name: nellore_frontend_dev
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/api/v1
      NEXT_PUBLIC_CDN_URL: http://localhost:8000
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_started
    networks:
      - nellore_dev_network
    restart: unless-stopped

  # ===========================================================================
  # NGINX Reverse Proxy
  # ===========================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: nellore_nginx_dev
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_started
      web:
        condition: service_started
    networks:
      - nellore_dev_network
    restart: unless-stopped

# =============================================================================
# Networks
# =============================================================================
networks:
  nellore_dev_network:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_dev_data:
  redis_dev_data:
