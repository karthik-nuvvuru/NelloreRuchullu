services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bello
      POSTGRES_PASSWORD: bello_secret_2024
      POSTGRES_DB: bello
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bello"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://bello:bello_secret_2024@postgres:5432/bello
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-this-in-production-use-openssl-rand-to-generate
      ENVIRONMENT: development
      RAZORPAY_KEY_ID: rzp_test_1234567890
      RAZORPAY_KEY_SECRET: test_secret_1234567890
      RAZORPAY_WEBHOOK_SECRET: webhook_secret_123
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: noreply@nellore-ruchullu.com
      SMTP_PASSWORD: placeholder
      TWILIO_ACCOUNT_SID: placeholder
      TWILIO_AUTH_TOKEN: placeholder
      TWILIO_FROM_NUMBER: "+919999999999"
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --workers 1"
    volumes:
      - ./backend:/app
      - /app/__pycache__

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://bello:bello_secret_2024@postgres:5432/bello
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-this-in-production-use-openssl-rand-to-generate
      ENVIRONMENT: development
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: noreply@nellore-ruchullu.com
      SMTP_PASSWORD: placeholder
      TWILIO_ACCOUNT_SID: placeholder
      TWILIO_AUTH_TOKEN: placeholder
      TWILIO_FROM_NUMBER: "+919999999999"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.celery_app.celery_app worker --loglevel=info

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - web

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/api/v1
      NEXT_PUBLIC_CDN_URL: http://localhost:8000
      NEXTAUTH_SECRET: change-this-auth-secret
      NEXTAUTH_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  redis_data:
