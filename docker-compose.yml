# =============================================================================
# NelloreRuchullu Docker Compose - Full Stack Production
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: nellore_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nelloreruchullu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nelloreruchullu_secret_2024}
      POSTGRES_DB: ${POSTGRES_DB:-nelloreruchullu}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nelloreruchullu} -d ${POSTGRES_DB:-nelloreruchullu}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nellore_network
    restart: unless-stopped

  # ===========================================================================
  # Redis Cache
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: nellore_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nellore_network
    restart: unless-stopped

  # ===========================================================================
  # Backend API (FastAPI)
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: nellore_backend
    environment:
      # Database - use the full connection string
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nelloreruchullu}:${POSTGRES_PASSWORD:-nelloreruchullu_secret_2024}@postgres:5432/${POSTGRES_DB:-nelloreruchullu}
      # Redis
      REDIS_URL: redis://redis:6379/0
      # Security
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production-use-openssl-rand-hex-32}
      # App
      APP_NAME: ${APP_NAME:-NelloreRuchullu API}
      VERSION: ${VERSION:-1.0.0}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      API_PREFIX: /api/v1
      # CORS
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:8000"]'
      # Razorpay
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_1234567890}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-test_secret_1234567890}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-webhook_secret_123}
      # Email
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-noreply@nellore-ruchullu.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-placeholder}
      # SMS
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-placeholder}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-placeholder}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-+919999999999}
      # Frontend URL for CORS
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - nellore_network
    restart: unless-stopped

  # ===========================================================================
  # Celery Worker (Background Jobs)
  # ===========================================================================
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nellore_celery
    command: celery -A app.celery_app.celery_app worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nelloreruchullu}:${POSTGRES_PASSWORD:-nelloreruchullu_secret_2024}@postgres:5432/${POSTGRES_DB:-nelloreruchullu}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production-use-openssl-rand-hex-32}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-noreply@nellore-ruchullu.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-placeholder}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-placeholder}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-placeholder}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-+919999999999}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nellore_network
    restart: unless-stopped

  # ===========================================================================
  # Frontend (Next.js)
  # ===========================================================================
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: nellore_frontend
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/api/v1}
      NEXT_PUBLIC_CDN_URL: ${NEXT_PUBLIC_CDN_URL:-http://localhost:8000}
      NODE_ENV: production
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - nellore_network
    restart: unless-stopped

  # ===========================================================================
  # NGINX Reverse Proxy
  # ===========================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: nellore_nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # SSL certificates (uncomment and configure for production)
      # - /etc/letsencrypt:/etc/letsencrypt:ro
      # - ./infra/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nellore_network
    restart: unless-stopped

  # ===========================================================================
  # Playwright E2E Tests
  # ===========================================================================
  playwright:
    build:
      context: .
      dockerfile: web/Dockerfile.playwright
    container_name: nellore_playwright
    environment:
      BASE_URL: ${BASE_URL:-http://web:3000}
      API_URL: ${API_URL:-http://backend:8000/api/v1}
      NODE_ENV: test
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./tests/screenshots:/app/tests/screenshots
      - ./tests/videos:/app/tests/videos
      - ./tests/report:/app/tests/report
    networks:
      - nellore_network
    # Run tests and exit
    command: >
      sh -c "
        echo 'Waiting for services...' &&
        sleep 10 &&
        echo 'Running Playwright tests...' &&
        npx playwright test --reporter=list --trace=on
      "

# =============================================================================
# Networks
# =============================================================================
networks:
  nellore_network:
    driver: bridge
    name: nellore_network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    name: nellore_postgres_data
  redis_data:
    name: nellore_redis_data
