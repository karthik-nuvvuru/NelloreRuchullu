services:
  app:
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-postgres}
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:8091
      CORS_ORIGINS: '["http://localhost:8091","http://127.0.0.1:8091"]'
      SEED_ON_START: "true"
    ports:
      - "8091:80"

  postgres:
    ports:
      - "5434:5432"

  redis:
    ports:
      - "6381:6379"
