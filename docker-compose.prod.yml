# =============================================================================
# NelloreRuchullu Docker Compose - Production Stack
# Uses external Supabase PostgreSQL + Redis Cloud from .env
# =============================================================================

services:
  # ===========================================================================
  # Backend API (FastAPI)
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: nellore_backend
    env_file:
      - .env
    extra_hosts:
      - "db.txezwqzxghcebvqhjoba.supabase.co:2406:da14:271:9913:89e4:a632:73d:a839"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - nellore_network
    restart: unless-stopped

  # ===========================================================================
  # Celery Worker (Background Jobs)
  # ===========================================================================
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nellore_celery
    command: celery -A app.celery_app.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env
    extra_hosts:
      - "db.txezwqzxghcebvqhjoba.supabase.co:2406:da14:271:9913:89e4:a632:73d:a839"
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app.celery_app inspect ping -d celery@$$HOSTNAME >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - nellore_network
    restart: unless-stopped

  # ===========================================================================
  # Frontend (Next.js)
  # ===========================================================================
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: nellore_frontend
    env_file:
      - .env
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      NODE_ENV: production
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - nellore_network
    restart: unless-stopped

  # ===========================================================================
  # NGINX Reverse Proxy
  # ===========================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: nellore_nginx
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nellore_network
    restart: unless-stopped

# =============================================================================
# Networks
# =============================================================================
networks:
  nellore_network:
    driver: bridge
    name: nellore_network
